<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CA Doubt Voice Recorder</title>


<style>

body {

  font-family: Arial, sans-serif;

  background: #f5f5f5;

  margin: 0;

  padding: 30px 20px;

}


.container {

  max-width: 650px;

  margin: auto;

  background: white;

  padding: 30px;

  border-radius: 18px;

  box-shadow:
    0 4px 20px
    rgba(0,0,0,0.12);

}


h1 {

  text-align: center;

}


.speaker {

  text-align: center;

  font-size: 20px;

  font-weight: bold;

  margin: 15px;

}


.context {

  background: #f1f3f4;

  padding: 18px;

  border-radius: 10px;

  margin: 20px 0;

}


.context div {

  margin: 8px 0;

}


.label {

  font-weight: bold;

}


input {

  width: 100%;

  box-sizing: border-box;

  padding: 12px;

  font-size: 16px;

  border:
    1px solid #ccc;

  border-radius: 8px;

  margin-top: 8px;

}


#timer {

  text-align: center;

  font-size: 42px;

  font-weight: bold;

  margin: 25px 0;

}


.buttons {

  text-align: center;

}


button {

  border: none;

  border-radius: 10px;

  padding: 14px 22px;

  margin: 6px;

  font-size: 16px;

  cursor: pointer;

}


#startBtn {

  background: #d93025;

  color: white;

}


#stopBtn {

  background: #444;

  color: white;

}


#resetBtn {

  background: #777;

  color: white;

}


#saveBtn {

  background: #188038;

  color: white;

}


button:disabled {

  opacity: 0.4;

  cursor: not-allowed;

}


audio {

  width: 100%;

  margin-top: 20px;

}


#status {

  text-align: center;

  margin-top: 20px;

  min-height: 30px;

}


#uploadFrame {

  display: none;

}

</style>

</head>


<body>


<div class="container">


<h1>

🎙️ CA Doubt Recorder

</h1>


<div class="speaker">

Speaker:

<span id="speaker"></span>

</div>


<div class="context">


<div>

<span class="label">
Subject:
</span>

<span id="subject"></span>

</div>


<div>

<span class="label">
Section:
</span>

<span id="section"></span>

</div>


<div>

<span class="label">
Doubt:
</span>

<span id="doubt"></span>

</div>


</div>


<label class="label">

Recording Name

</label>


<input

  id="recordingName"

  type="text"

  placeholder=
  "Enter a name for this recording"


>


<div id="timer">

00:00

</div>


<div class="buttons">


<button

  id="startBtn"

  onclick=
  "startRecording()"

>

🎙️ Start Recording

</button>


<button

  id="stopBtn"

  onclick=
  "stopRecording()"

  disabled

>

⏹️ Stop

</button>


<button

  id="resetBtn"

  onclick=
  "resetRecorder()"

  disabled

>

🔄 Reset

</button>


</div>


<audio

  id="audioPlayer"

  controls

  style="display:none;">

</audio>


<div class="buttons">


<button

  id="saveBtn"

  onclick=
  "saveRecording()"

  disabled

>

☁️ Save to Google Drive

</button>


</div>


<div id="status">

Ready to record.

</div>


<iframe

  name="uploadFrame"

  id="uploadFrame"

>

</iframe>


</div>



<script>


/***************************************************
 * PUT YOUR NEW APPS SCRIPT /exec URL HERE
 ***************************************************/

const APPS_SCRIPT_URL =

  'https://script.google.com/macros/s/AKfycbybRayDZ42dKvOauNAzVCYcP2YSNhQgUesV2KD4ianQSz1daTLz8s_zfL3Pu9cxmzX2yQ/exec';


/***************************************************
 * READ INFORMATION FROM GOOGLE SHEET
 ***************************************************/

const params =

  new URLSearchParams(
    window.location.search
  );


const row =

  params.get('row') || '';


const speaker =

  params.get('speaker') ||

  'Dhabbaaa swaram';


const subject =

  params.get('subject') || '';


const section =

  params.get('section') || '';


const doubt =

  params.get('doubt') || '';


/***************************************************
 * SHOW CONTEXT
 ***************************************************/

document.getElementById(
  'speaker'
).innerText = speaker;


document.getElementById(
  'subject'
).innerText =
  subject || '—';


document.getElementById(
  'section'
).innerText =
  section || '—';


document.getElementById(
  'doubt'
).innerText =
  doubt || '—';


/***************************************************
 * DEFAULT RECORDING NAME
 ***************************************************/

document.getElementById(
  'recordingName'
).value =

  (

    subject ||

    'CA Doubt'

  )

  +

  (

    section

      ? ' - ' + section

      : ''

  );


/***************************************************
 * RECORDING VARIABLES
 ***************************************************/

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let timerInterval = null;

let seconds = 0;


/***************************************************
 * START RECORDING
 ***************************************************/

async function startRecording() {


  try {


    const stream =

      await navigator
        .mediaDevices
        .getUserMedia({

          audio: true

        });


    audioChunks = [];


    mediaRecorder =

      new MediaRecorder(
        stream
      );


    mediaRecorder.ondataavailable =

      function(event) {


        if (
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =

      function() {


        audioBlob =

          new Blob(

            audioChunks,

            {

              type:
                'audio/webm'

            }

          );


        const audioURL =

          URL.createObjectURL(
            audioBlob
          );


        const player =

          document.getElementById(
            'audioPlayer'
          );


        player.src =
          audioURL;


        player.style.display =
          'block';


        document.getElementById(
          'saveBtn'
        ).disabled = false;


        document.getElementById(
          'status'
        ).innerText =

          '✅ Recording finished. Listen before saving.';

      };


    mediaRecorder.start();


    document.getElementById(
      'startBtn'
    ).disabled = true;


    document.getElementById(
      'stopBtn'
    ).disabled = false;


    document.getElementById(
      'resetBtn'
    ).disabled = true;


    seconds = 0;


    updateTimer();


    timerInterval =

      setInterval(

        updateTimer,

        1000

      );


    document.getElementById(
      'status'
    ).innerText =

      '🔴 Recording...';


  }


  catch(error) {


    document.getElementById(
      'status'
    ).innerText =

      '❌ Microphone permission failed.';

  }

}


/***************************************************
 * STOP RECORDING
 ***************************************************/

function stopRecording() {


  if (

    mediaRecorder &&

    mediaRecorder.state !==
      'inactive'

  ) {


    mediaRecorder.stop();


    mediaRecorder.stream
      .getTracks()
      .forEach(

        track =>
          track.stop()

      );

  }


  clearInterval(
    timerInterval
  );


  document.getElementById(
    'startBtn'
  ).disabled = true;


  document.getElementById(
    'stopBtn'
  ).disabled = true;


  document.getElementById(
    'resetBtn'
  ).disabled = false;

}


/***************************************************
 * TIMER
 ***************************************************/

function updateTimer() {


  seconds++;


  const minutes =

    Math.floor(
      seconds / 60
    );


  const secs =

    seconds % 60;


  document.getElementById(
    'timer'
  ).innerText =

    String(minutes)
      .padStart(2, '0')

    +

    ':'

    +

    String(secs)
      .padStart(2, '0');

}


/***************************************************
 * RESET
 ***************************************************/

function resetRecorder() {


  audioChunks = [];

  audioBlob = null;


  const player =

    document.getElementById(
      'audioPlayer'
    );


  player.src = '';

  player.style.display =
    'none';


  document.getElementById(
    'timer'
  ).innerText =
    '00:00';


  document.getElementById(
    'status'
  ).innerText =
    'Ready to record.';


  document.getElementById(
    'startBtn'
  ).disabled = false;


  document.getElementById(
    'stopBtn'
  ).disabled = true;


  document.getElementById(
    'resetBtn'
  ).disabled = true;


  document.getElementById(
    'saveBtn'
  ).disabled = true;


  seconds = 0;

}


/***************************************************
 * SAVE RECORDING
 ***************************************************/

function saveRecording() {


  if (!audioBlob) {

    return;

  }


  const recordingName =

    document
      .getElementById(
        'recordingName'
      )
      .value
      .trim();


  if (!recordingName) {


    alert(
      'Please enter a recording name.'
    );


    return;

  }


  document.getElementById(
    'saveBtn'
  ).disabled = true;


  document.getElementById(
    'status'
  ).innerText =

    '⏳ Saving to Google Drive...';


  const reader =

    new FileReader();


  reader.onloadend =

    function() {


      const base64 =

        reader.result
          .split(',')[1];


      const form =

        document.createElement(
          'form'
        );


      form.method =
        'POST';


      form.action =
        APPS_SCRIPT_URL;


      form.target =
        'uploadFrame';


      /***********************************************
       * SEND AUDIO
       ***********************************************/

      addField(
        form,
        'audioData',
        base64
      );


      /***********************************************
       * SEND RECORDING NAME
       ***********************************************/

      addField(
        form,
        'recordingName',
        recordingName
      );
      addField(
  form,
  'fileName',
  recordingName + '.webm'
);


      /***********************************************
       * SEND ROW
       ***********************************************/

      addField(
        form,
        'rowNumber',
        row
      );


      /***********************************************
       * SEND SPEAKER
       ***********************************************/

      addField(
        form,
        'speaker',
        speaker
      );


      /***********************************************
       * SEND CONTEXT
       ***********************************************/

      addField(
        form,
        'subject',
        subject
      );


      addField(
        form,
        'section',
        section
      );


      addField(
        form,
        'doubt',
        doubt
      );


      document.body.appendChild(
        form
      );


      /***********************************************
       * WHEN GOOGLE RESPONDS
       *
       * The iframe load means Apps Script has
       * returned its response.
       ***********************************************/

      const iframe =

        document.getElementById(
          'uploadFrame'
        );


      iframe.onload =

        function() {


          document.getElementById(
            'status'
          ).innerText =

            '✅ Saved to Google Drive';


        };


      form.submit();


      form.remove();

    };


  reader.readAsDataURL(
    audioBlob
  );

}


/***************************************************
 * ADD HIDDEN FIELD
 ***************************************************/

function addField(
  form,
  name,
  value
) {


  const input =

    document.createElement(
      'input'
    );


  input.type =
    'hidden';


  input.name =
    name;


  input.value =
    value;


  form.appendChild(
    input
  );

}

</script>


</body>

</html>
