<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#080d18">

<title>CA Doubt Voice Recorder</title>


<style>

/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}


html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}


body {

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  color: #182235;

  background:

    radial-gradient(
      circle at 15% 5%,
      rgba(99,102,241,.16),
      transparent 28%
    ),

    radial-gradient(
      circle at 90% 10%,
      rgba(14,165,233,.12),
      transparent 25%
    ),

    linear-gradient(
      135deg,
      #f8fafc,
      #eef2f7
    );

  min-height: 100vh;

  padding:
    10px
    14px
    calc(10px + env(safe-area-inset-bottom));

}


:root {

  --navy: #080d18;

  --navy2: #111a2c;

  --blue: #3b82f6;

  --purple: #7c3aed;

  --red: #ef4444;

  --green: #16a34a;

  --text: #182235;

  --muted: #718096;

  --line: #e5e9f0;

  --white: #ffffff;

}


/* =========================================================
   APP
   ========================================================= */

.app {

  width: 100%;

  max-width: 760px;

  margin: 0 auto;

}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {

  height: 50px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 8px;

}


.brand {

  display: flex;

  align-items: center;

  gap: 9px;

}


.brand-icon {

  width: 38px;

  height: 38px;

  border-radius: 12px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 19px;

  color: white;

  background:

    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  box-shadow:

    0 6px 16px
    rgba(37,99,235,.22);

}


.brand-title {

  font-size: 14px;

  font-weight: 850;

  letter-spacing: -.25px;

}


.brand-subtitle {

  font-size: 9px;

  color: #7a879a;

  margin-top: 1px;

}


.speaker-badge {

  display: flex;

  align-items: center;

  gap: 5px;

  max-width: 150px;

  padding: 6px 9px;

  border-radius: 999px;

  background: #e8efff;

  color: #2856a8;

  font-size: 9px;

  font-weight: 800;

}


.speaker-dot {

  width: 6px;

  height: 6px;

  border-radius: 50%;

  background: #3b82f6;

}


/* =========================================================
   MAIN CARD
   ========================================================= */

.main-card {

  background: rgba(255,255,255,.96);

  border: 1px solid rgba(255,255,255,.8);

  border-radius: 20px;

  overflow: hidden;

  box-shadow:

    0 15px 45px
    rgba(15,23,42,.10);

}


/* =========================================================
   HEADER
   ========================================================= */

.doubt-header {

  min-height: 94px;

  padding: 15px 18px;

  color: white;

  background:

    radial-gradient(
      circle at 90% 20%,
      rgba(99,102,241,.30),
      transparent 28%
    ),

    linear-gradient(
      135deg,
      #080d18,
      #121d32
    );

  position: relative;

  overflow: hidden;

}


.doubt-header::before {

  content: "";

  position: absolute;

  width: 130px;

  height: 130px;

  border-radius: 50%;

  right: -60px;

  bottom: -90px;

  border:
    1px solid
    rgba(255,255,255,.08);

}


.small-label {

  font-size: 8px;

  font-weight: 850;

  text-transform: uppercase;

  letter-spacing: 1.4px;

  color: #8796b0;

  margin-bottom: 4px;

}


.doubt-title {

  position: relative;

  margin: 0;

  font-size: 18px;

  line-height: 1.15;

  font-weight: 850;

  letter-spacing: -.3px;

}


.doubt-section {

  display: inline-flex;

  margin-top: 7px;

  padding: 4px 8px;

  border-radius: 6px;

  background:
    rgba(255,255,255,.09);

  color: #b8c5d9;

  font-size: 9px;

  font-weight: 750;

}


/* =========================================================
   DOUBT AREA
   ========================================================= */

.context {

  padding: 11px 18px;

  border-bottom: 1px solid var(--line);

}


.context-label {

  font-size: 8px;

  font-weight: 850;

  letter-spacing: 1.2px;

  text-transform: uppercase;

  color: #8a96a8;

  margin-bottom: 4px;

}


.doubt-text {

  font-size: 11px;

  line-height: 1.4;

  color: #3c4758;

  max-height: 48px;

  overflow-y: auto;

  white-space: pre-wrap;

}


/* =========================================================
   RECORDING NAME
   ========================================================= */

.form-section {

  padding: 10px 18px;

}


.input-label {

  display: block;

  font-size: 9px;

  font-weight: 800;

  color: #657185;

  margin-bottom: 5px;

}


.recording-input {

  width: 100%;

  height: 36px;

  border: 1px solid var(--line);

  background: #f8fafc;

  border-radius: 9px;

  padding: 0 11px;

  font-size: 11px;

  color: var(--text);

  outline: none;

  transition: .2s;

}


.recording-input:focus {

  background: white;

  border-color: var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(59,130,246,.10);

}


/* =========================================================
   RECORDER
   ========================================================= */

.recorder-area {

  text-align: center;

  padding:
    2px
    18px
    13px;

}


.status-pill {

  display: inline-flex;

  align-items: center;

  gap: 5px;

  padding: 4px 9px;

  border-radius: 999px;

  background: #f1f5f9;

  color: #69778a;

  font-size: 8px;

  font-weight: 800;

}


.status-dot {

  width: 5px;

  height: 5px;

  border-radius: 50%;

  background: #94a3b8;

}


.status-pill.recording {

  color: #b91c1c;

  background: #fee2e2;

}


.status-pill.recording .status-dot {

  background: var(--red);

  animation: pulse 1s infinite;

}


.status-pill.success {

  color: #15803d;

  background: #dcfce7;

}


.status-pill.success .status-dot {

  background: var(--green);

}


@keyframes pulse {

  50% {
    transform: scale(1.6);
    opacity: .45;
  }

}


/* =========================================================
   TIMER
   ========================================================= */

.timer {

  font-size: 38px;

  line-height: 1;

  font-weight: 850;

  letter-spacing: -2px;

  color: #0c1424;

  margin: 7px 0 9px;

  font-variant-numeric: tabular-nums;

}


/* =========================================================
   RECORD BUTTON
   ========================================================= */

.record-button-wrap {

  display: flex;

  justify-content: center;

  margin-bottom: 6px;

}


.record-button-ring {

  width: 68px;

  height: 68px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 50%;

  background:

    radial-gradient(
      circle,
      rgba(239,68,68,.10),
      transparent 68%
    );

}


.record-button {

  width: 52px;

  height: 52px;

  border: none;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 20px;

  color: white;

  cursor: pointer;

  background:

    linear-gradient(
      145deg,
      #ff5555,
      #dc2626
    );

  box-shadow:

    0 7px 18px
    rgba(239,68,68,.28);

  transition: .18s;

}


.record-button:active {

  transform: scale(.92);

}


.recording-active
.record-button-ring {

  animation: ring 1.3s infinite;

}


@keyframes ring {

  0% {
    box-shadow:
      0 0 0 0 rgba(239,68,68,.20);
  }

  70% {
    box-shadow:
      0 0 0 13px rgba(239,68,68,0);
  }

  100% {
    box-shadow:
      0 0 0 0 rgba(239,68,68,0);
  }

}


.record-label {

  font-size: 8px;

  color: #7b8798;

  font-weight: 750;

  margin-bottom: 7px;

}


/* =========================================================
   SMALL CONTROLS
   ========================================================= */

.controls {

  display: flex;

  justify-content: center;

  gap: 6px;

}


.control-button {

  border: 1px solid var(--line);

  background: white;

  color: #4b5563;

  border-radius: 7px;

  padding: 6px 11px;

  font-size: 9px;

  font-weight: 800;

  cursor: pointer;

}


.control-button.stop {

  color: #b91c1c;

}


/* =========================================================
   AUDIO
   ========================================================= */

.audio-section {

  display: none;

  margin-top: 10px;

  padding: 9px;

  border-radius: 9px;

  background: #f7f9fc;

  border: 1px solid var(--line);

  text-align: left;

}


.audio-title {

  font-size: 8px;

  font-weight: 800;

  color: #536074;

  margin-bottom: 5px;

}


audio {

  width: 100%;

  height: 30px;

}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 8px;

  padding:
    10px
    18px;

  border-top: 1px solid var(--line);

  background: #fbfcfe;

}


.action-button {

  height: 35px;

  border: none;

  border-radius: 9px;

  font-size: 10px;

  font-weight: 850;

  cursor: pointer;

  transition: .18s;

}


.action-button:active {

  transform: scale(.98);

}


.save-button {

  color: white;

  background:

    linear-gradient(
      135deg,
      #16a34a,
      #15803d
    );

  box-shadow:
    0 5px 12px
    rgba(22,163,74,.17);

}


.history-button {

  color: #334155;

  background: #edf2f7;

}


/* =========================================================
   STATUS
   ========================================================= */

.footer-status {

  min-height: 21px;

  padding:
    0
    18px
    9px;

  text-align: center;

  font-size: 8px;

  color: #8994a5;

}


button:disabled {

  opacity: .42;

  cursor: not-allowed;

  box-shadow: none !important;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 500px) {

  body {

    padding:
      6px
      7px
      calc(7px + env(safe-area-inset-bottom));

  }


  .topbar {

    height: 43px;

    margin-bottom: 6px;

  }


  .brand-icon {

    width: 33px;

    height: 33px;

    font-size: 16px;

    border-radius: 10px;

  }


  .brand-title {

    font-size: 12px;

  }


  .brand-subtitle {

    display: none;

  }


  .speaker-badge {

    max-width: 125px;

    font-size: 8px;

  }


  .main-card {

    border-radius: 16px;

  }


  .doubt-header {

    min-height: 82px;

    padding: 12px 14px;

  }


  .doubt-title {

    font-size: 16px;

  }


  .context {

    padding:
      9px
      14px;

  }


  .doubt-text {

    font-size: 10px;

    max-height: 39px;

  }


  .form-section {

    padding:
      8px
      14px;

  }


  .recorder-area {

    padding:
      1px
      14px
      10px;

  }


  .timer {

    font-size: 34px;

    margin:
      5px
      0
      7px;

  }


  .record-button-ring {

    width: 60px;

    height: 60px;

  }


  .record-button {

    width: 47px;

    height: 47px;

    font-size: 18px;

  }


  .actions {

    padding:
      8px
      14px;

  }


  .footer-status {

    padding-bottom: 7px;

  }

}


/* =========================================================
   SHORT LAPTOP / SMALL SCREEN
   ========================================================= */

@media (max-height: 700px) and (min-width: 501px) {

  body {

    padding-top: 5px;

    padding-bottom: 5px;

  }


  .topbar {

    height: 40px;

    margin-bottom: 4px;

  }


  .brand-icon {

    width: 32px;

    height: 32px;

  }


  .doubt-header {

    min-height: 78px;

    padding:
      10px
      16px;

  }


  .context {

    padding:
      8px
      16px;

  }


  .form-section {

    padding:
      7px
      16px;

  }


  .recorder-area {

    padding-bottom: 8px;

  }


  .timer {

    font-size: 32px;

    margin:
      4px
      0
      5px;

  }


  .record-button-ring {

    width: 57px;

    height: 57px;

  }


  .record-button {

    width: 45px;

    height: 45px;

    font-size: 17px;

  }


  .actions {

    padding:
      7px
      16px;

  }


  .footer-status {

    padding-bottom: 5px;

  }

}


</style>

</head>


<body>


<div class="app">


  <!-- TOP BAR -->

  <div class="topbar">


    <div class="brand">


      <div class="brand-icon">
        🎙️
      </div>


      <div>

        <div class="brand-title">
          CA Doubt Recorder
        </div>

        <div class="brand-subtitle">
          Capture your doubts • Keep learning
        </div>

      </div>


    </div>


    <div class="speaker-badge">

      <span class="speaker-dot"></span>

      <span id="speaker">
      </span>

    </div>


  </div>



  <!-- MAIN CARD -->

  <div class="main-card">


    <!-- HEADER -->

    <div class="doubt-header">

      <div class="small-label">
        CURRENT DOUBT
      </div>


      <h1
        class="doubt-title"
        id="subject"
      >
        CA Doubt
      </h1>


      <div
        class="doubt-section"
        id="section"
      >
        —
      </div>

    </div>



    <!-- QUESTION -->

    <div class="context">

      <div class="context-label">
        YOUR QUESTION
      </div>


      <div
        class="doubt-text"
        id="doubt"
      >
        —
      </div>

    </div>



    <!-- RECORDING NAME -->

    <div class="form-section">

      <label
        class="input-label"
        for="recordingName"
      >
        Recording Name
      </label>


      <input

        id="recordingName"

        class="recording-input"

        type="text"

        placeholder="Give this recording a name"

        autocomplete="off"

      >

    </div>



    <!-- RECORDER -->

    <div
      class="recorder-area"
      id="recorderArea"
    >


      <div
        class="status-pill"
        id="statusPill"
      >

        <span
          class="status-dot"
        ></span>

        <span id="statusText">
          Ready to record
        </span>

      </div>



      <div
        class="timer"
        id="timer"
      >
        00:00
      </div>



      <div class="record-button-wrap">

        <div class="record-button-ring">

          <button

            id="startBtn"

            class="record-button"

            onclick="startRecording()"

            title="Start Recording"

          >
            🎙️
          </button>

        </div>

      </div>


      <div
        class="record-label"
        id="recordLabel"
      >
        Tap to start recording
      </div>



      <div class="controls">


        <button

          id="stopBtn"

          class="control-button stop"

          onclick="stopRecording()"

          disabled

        >
          ⏹ Stop
        </button>


        <button

          id="resetBtn"

          class="control-button"

          onclick="resetRecorder()"

          disabled

        >
          🔄 Reset
        </button>


      </div>



      <!-- AUDIO -->

      <div
        class="audio-section"
        id="audioSection"
      >

        <div class="audio-title">
          🎧 Listen before saving
        </div>


        <audio
          id="audioPlayer"
          controls
        ></audio>

      </div>


    </div>



    <!-- ACTIONS -->

    <div class="actions">


      <button

        id="saveBtn"

        class="action-button save-button"

        onclick="saveRecording()"

        disabled

      >
        ☁️ Save to Google Drive
      </button>


      <button

        id="historyBtn"

        class="action-button history-button"

        onclick="openHistory()"

      >
        📜 Voice History
      </button>


    </div>



    <!-- STATUS -->

    <div
      class="footer-status"
      id="status"
    >
      Ready to record.
    </div>


  </div>


</div>



<iframe
  name="uploadFrame"
  id="uploadFrame"
  style="display:none;"
></iframe>



<script>


/* =========================================================
   APPS SCRIPT URL
   ========================================================= */

const APPS_SCRIPT_URL =

  'https://script.google.com/macros/s/AKfycbybRayDZ42dKvOauNAzVCYcP2YSNhQgUesV2KD4ianQSz1daTLz8s_zfL3Pu9cxmzX2yQ/exec';



/* =========================================================
   URL PARAMETERS
   ========================================================= */

const params =

  new URLSearchParams(
    window.location.search
  );


const row =
  params.get('row') || '';


const speaker =
  params.get('speaker') ||
  'Dhabbaaa swaram';


const subject =
  params.get('subject') || '';


const section =
  params.get('section') || '';


const doubt =
  params.get('doubt') || '';



/* =========================================================
   DISPLAY DATA
   ========================================================= */

document.getElementById(
  'speaker'
).innerText = speaker;


document.getElementById(
  'subject'
).innerText =
  subject || 'CA Doubt';


document.getElementById(
  'section'
).innerText =
  section || 'No section';


document.getElementById(
  'doubt'
).innerText =
  doubt || 'No doubt text';



/* =========================================================
   DEFAULT NAME
   ========================================================= */

document.getElementById(
  'recordingName'
).value =

  (

    subject ||

    'CA Doubt'

  )

  +

  (

    section

      ? ' - ' + section

      : ''

  );



/* =========================================================
   VARIABLES
   ========================================================= */

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let timerInterval = null;

let seconds = 0;



/* =========================================================
   ELEMENTS
   ========================================================= */

const recorderArea =
  document.getElementById(
    'recorderArea'
  );


const statusPill =
  document.getElementById(
    'statusPill'
  );


const statusText =
  document.getElementById(
    'statusText'
  );


const recordLabel =
  document.getElementById(
    'recordLabel'
  );


const audioSection =
  document.getElementById(
    'audioSection'
  );


const audioPlayer =
  document.getElementById(
    'audioPlayer'
  );



/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  message,
  type = 'ready'
) {


  statusText.innerText =
    message;


  statusPill.classList.remove(
    'recording',
    'success'
  );


  if (
    type === 'recording'
  ) {

    statusPill.classList.add(
      'recording'
    );

  }


  if (
    type === 'success'
  ) {

    statusPill.classList.add(
      'success'
    );

  }


  document.getElementById(
    'status'
  ).innerText =
    message;

}



/* =========================================================
   HISTORY
   ========================================================= */

function openHistory() {


  const historyURL =

    APPS_SCRIPT_URL +

    '?action=history&speaker=' +

    encodeURIComponent(
      speaker
    );


  window.open(
    historyURL,
    '_blank'
  );

}



/* =========================================================
   START RECORDING
   ========================================================= */

async function startRecording() {


  try {


    const stream =

      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });


    audioChunks = [];


    mediaRecorder =

      new MediaRecorder(
        stream
      );


    mediaRecorder.ondataavailable =

      function(event) {

        if (
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =

      function() {


        audioBlob =

          new Blob(
            audioChunks,
            {
              type:
                'audio/webm'
            }
          );


        const audioURL =

          URL.createObjectURL(
            audioBlob
          );


        audioPlayer.src =
          audioURL;


        audioSection.style.display =
          'block';


        document.getElementById(
          'saveBtn'
        ).disabled = false;


        setStatus(
          'Recording finished. Listen before saving.',
          'success'
        );


        recordLabel.innerText =
          'Recording ready to save';

      };


    mediaRecorder.start();


    document.getElementById(
      'startBtn'
    ).disabled = true;


    document.getElementById(
      'stopBtn'
    ).disabled = false;


    document.getElementById(
      'resetBtn'
    ).disabled = true;


    recorderArea.classList.add(
      'recording-active'
    );


    seconds = 0;


    document.getElementById(
      'timer'
    ).innerText =
      '00:00';


    timerInterval =

      setInterval(
        updateTimer,
        1000
      );


    recordLabel.innerText =
      'Recording in progress...';


    setStatus(
      'Recording...',
      'recording'
    );

  }


  catch(error) {


    console.error(error);


    setStatus(
      'Microphone permission failed.'
    );


    alert(
      'Please allow microphone access and try again.'
    );

  }

}



/* =========================================================
   STOP
   ========================================================= */

function stopRecording() {


  if (

    mediaRecorder &&

    mediaRecorder.state !==
      'inactive'

  ) {


    mediaRecorder.stop();


    mediaRecorder.stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  clearInterval(
    timerInterval
  );


  document.getElementById(
    'startBtn'
  ).disabled = true;


  document.getElementById(
    'stopBtn'
  ).disabled = true;


  document.getElementById(
    'resetBtn'
  ).disabled = false;


  recorderArea.classList.remove(
    'recording-active'
  );

}



/* =========================================================
   TIMER
   ========================================================= */

function updateTimer() {


  seconds++;


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  document.getElementById(
    'timer'
  ).innerText =

    String(minutes)
      .padStart(2, '0')

    +

    ':'

    +

    String(secs)
      .padStart(2, '0');

}



/* =========================================================
   RESET
   ========================================================= */

function resetRecorder() {


  audioChunks = [];

  audioBlob = null;


  audioPlayer.pause();

  audioPlayer.src = '';


  audioSection.style.display =
    'none';


  document.getElementById(
    'timer'
  ).innerText =
    '00:00';


  document.getElementById(
    'startBtn'
  ).disabled = false;


  document.getElementById(
    'stopBtn'
  ).disabled = true;


  document.getElementById(
    'resetBtn'
  ).disabled = true;


  document.getElementById(
    'saveBtn'
  ).disabled = true;


  recorderArea.classList.remove(
    'recording-active'
  );


  recordLabel.innerText =
    'Tap to start recording';


  setStatus(
    'Ready to record.'
  );


  seconds = 0;

}



/* =========================================================
   SAVE
   ========================================================= */

function saveRecording() {


  if (!audioBlob) {

    return;

  }


  const recordingName =

    document
      .getElementById(
        'recordingName'
      )
      .value
      .trim();


  if (!recordingName) {

    alert(
      'Please enter a recording name.'
    );

    return;

  }


  document.getElementById(
    'saveBtn'
  ).disabled = true;


  setStatus(
    'Saving to Google Drive...'
  );


  const reader =
    new FileReader();


  reader.onloadend =

    function() {


      const base64 =

        reader.result
          .split(',')[1];


      const form =
        document.createElement(
          'form'
        );


      form.method =
        'POST';


      form.action =
        APPS_SCRIPT_URL;


      form.target =
        'uploadFrame';



      addField(
        form,
        'audioData',
        base64
      );


      addField(
        form,
        'recordingName',
        recordingName
      );


      addField(
        form,
        'fileName',
        recordingName + '.webm'
      );


      addField(
        form,
        'rowNumber',
        row
      );


      addField(
        form,
        'speaker',
        speaker
      );


      addField(
        form,
        'subject',
        subject
      );


      addField(
        form,
        'section',
        section
      );


      addField(
        form,
        'doubt',
        doubt
      );


      document.body.appendChild(
        form
      );


      const iframe =
        document.getElementById(
          'uploadFrame'
        );


      iframe.onload =
        function() {


          setStatus(
            '✅ Saved successfully to Google Drive.',
            'success'
          );


          document.getElementById(
            'saveBtn'
          ).disabled = false;

        };


      form.submit();


      form.remove();

    };


  reader.readAsDataURL(
    audioBlob
  );

}



/* =========================================================
   HIDDEN FIELD
   ========================================================= */

function addField(
  form,
  name,
  value
) {


  const input =
    document.createElement(
      'input'
    );


  input.type =
    'hidden';


  input.name =
    name;


  input.value =
    value;


  form.appendChild(
    input
  );

}

</script>
