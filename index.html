<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b1220"
  >

  <title>CA Doubt Voice Recorder</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    :root {

      --bg: #eef2f7;
      --card: #ffffff;
      --dark: #0b1220;
      --dark-2: #151f32;
      --text: #172033;
      --muted: #718096;
      --border: #e5e9f0;

      --primary: #2563eb;
      --primary-dark: #1d4ed8;

      --danger: #ef4444;
      --danger-dark: #dc2626;

      --success: #16a34a;
      --success-dark: #15803d;

      --shadow:
        0 18px 50px rgba(15, 23, 42, 0.10);

      --radius: 22px;

    }


    html {
      min-height: 100%;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          rgba(37, 99, 235, 0.12),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #f8fafc 0%,
          var(--bg) 100%
        );

      color: var(--text);

      padding:
        24px 16px
        calc(24px + env(safe-area-inset-bottom));

    }


    .app {

      width: 100%;

      max-width: 720px;

      margin: 0 auto;

    }


    /* =========================================
       TOP HEADER
       ========================================= */

    .topbar {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 18px;

    }


    .brand {

      display: flex;

      align-items: center;

      gap: 12px;

    }


    .brand-icon {

      width: 46px;

      height: 46px;

      border-radius: 15px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 23px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      color: white;

      box-shadow:
        0 10px 25px
        rgba(37, 99, 235, 0.25);

    }


    .brand-title {

      font-size: 17px;

      font-weight: 800;

      letter-spacing: -0.3px;

    }


    .brand-subtitle {

      font-size: 11px;

      color: var(--muted);

      margin-top: 2px;

    }


    /* =========================================
       SPEAKER BADGE
       ========================================= */

    .speaker-badge {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding: 9px 13px;

      border-radius: 999px;

      background: #e8eefc;

      color: #244c9b;

      font-size: 12px;

      font-weight: 800;

      max-width: 180px;

    }


    .speaker-dot {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      background: #2563eb;

      flex-shrink: 0;

    }


    /* =========================================
       MAIN CARD
       ========================================= */

    .main-card {

      background: rgba(255,255,255,0.96);

      border: 1px solid rgba(255,255,255,0.8);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      overflow: hidden;

    }


    /* =========================================
       DOUBT HEADER
       ========================================= */

    .doubt-header {

      background:
        linear-gradient(
          135deg,
          var(--dark),
          var(--dark-2)
        );

      color: white;

      padding: 25px 22px 24px;

      position: relative;

      overflow: hidden;

    }


    .doubt-header::after {

      content: "";

      position: absolute;

      width: 180px;

      height: 180px;

      border-radius: 50%;

      background:
        rgba(59, 130, 246, 0.12);

      right: -70px;

      top: -80px;

    }


    .small-label {

      font-size: 10px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 1.5px;

      color: #93a4bf;

      margin-bottom: 7px;

    }


    .doubt-title {

      font-size: 22px;

      font-weight: 800;

      line-height: 1.25;

      margin: 0;

      position: relative;

      z-index: 1;

    }


    .doubt-section {

      display: inline-flex;

      margin-top: 12px;

      padding: 6px 10px;

      border-radius: 8px;

      background: rgba(255,255,255,0.10);

      color: #cbd5e1;

      font-size: 12px;

      font-weight: 700;

      position: relative;

      z-index: 1;

    }


    /* =========================================
       DOUBT DETAILS
       ========================================= */

    .context {

      padding: 20px 22px;

      border-bottom: 1px solid var(--border);

    }


    .context-label {

      font-size: 10px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 1.3px;

      color: var(--muted);

      margin-bottom: 8px;

    }


    .doubt-text {

      font-size: 15px;

      line-height: 1.65;

      color: #293548;

      white-space: pre-wrap;

    }


    /* =========================================
       RECORDING NAME
       ========================================= */

    .form-section {

      padding: 20px 22px;

    }


    .input-label {

      display: block;

      font-size: 12px;

      font-weight: 800;

      color: #4a5568;

      margin-bottom: 8px;

    }


    .recording-input {

      width: 100%;

      border: 1px solid var(--border);

      background: #f8fafc;

      border-radius: 13px;

      padding: 14px 15px;

      font-size: 15px;

      color: var(--text);

      outline: none;

      transition: all 0.2s ease;

    }


    .recording-input:focus {

      background: white;

      border-color: var(--primary);

      box-shadow:
        0 0 0 4px
        rgba(37, 99, 235, 0.10);

    }


    /* =========================================
       RECORDER AREA
       ========================================= */

    .recorder-area {

      padding: 6px 22px 28px;

      text-align: center;

    }


    .status-pill {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding: 7px 12px;

      border-radius: 999px;

      background: #f1f5f9;

      color: #64748b;

      font-size: 11px;

      font-weight: 800;

      margin-bottom: 15px;

    }


    .status-dot {

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background: #94a3b8;

    }


    .status-pill.recording {

      background: #fee2e2;

      color: #b91c1c;

    }


    .status-pill.recording .status-dot {

      background: var(--danger);

      animation: pulseDot 1s infinite;

    }


    .status-pill.success {

      background: #dcfce7;

      color: #15803d;

    }


    .status-pill.success .status-dot {

      background: var(--success);

    }


    @keyframes pulseDot {

      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }

    }


    /* =========================================
       TIMER
       ========================================= */

    .timer {

      font-size: 52px;

      line-height: 1;

      font-weight: 800;

      letter-spacing: -2px;

      color: var(--dark);

      margin: 5px 0 22px;

      font-variant-numeric: tabular-nums;

    }


    /* =========================================
       RECORD BUTTON
       ========================================= */

    .record-button-wrap {

      display: flex;

      justify-content: center;

      align-items: center;

      position: relative;

      margin-bottom: 18px;

    }


    .record-button-ring {

      width: 116px;

      height: 116px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        radial-gradient(
          circle,
          rgba(239,68,68,0.13) 0%,
          rgba(239,68,68,0.04) 55%,
          transparent 56%
        );

      transition: all 0.3s ease;

    }


    .record-button {

      width: 82px;

      height: 82px;

      border-radius: 50%;

      border: none;

      background:
        linear-gradient(
          145deg,
          #ef4444,
          #dc2626
        );

      color: white;

      font-size: 30px;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      box-shadow:
        0 12px 28px
        rgba(239, 68, 68, 0.30);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

    }


    .record-button:active {

      transform: scale(0.94);

    }


    .recording-active
    .record-button-ring {

      animation: recordingRing 1.4s infinite;

    }


    @keyframes recordingRing {

      0% {

        box-shadow:
          0 0 0 0
          rgba(239,68,68,0.25);

      }

      70% {

        box-shadow:
          0 0 0 22px
          rgba(239,68,68,0);

      }

      100% {

        box-shadow:
          0 0 0 0
          rgba(239,68,68,0);

      }

    }


    .record-label {

      font-size: 12px;

      font-weight: 800;

      color: #64748b;

      margin-top: 4px;

    }


    /* =========================================
       CONTROL BUTTONS
       ========================================= */

    .controls {

      display: flex;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;

    }


    .control-button {

      border: 1px solid var(--border);

      background: white;

      color: #334155;

      border-radius: 11px;

      padding: 10px 15px;

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;

      transition: all 0.2s ease;

    }


    .control-button:hover {

      background: #f8fafc;

    }


    .control-button:active {

      transform: scale(0.97);

    }


    .control-button.stop {

      color: #b91c1c;

    }


    /* =========================================
       AUDIO PLAYER
       ========================================= */

    .audio-section {

      display: none;

      margin-top: 22px;

      padding: 16px;

      border-radius: 15px;

      background: #f8fafc;

      border: 1px solid var(--border);

      text-align: left;

    }


    .audio-title {

      display: flex;

      align-items: center;

      gap: 8px;

      font-size: 12px;

      font-weight: 800;

      margin-bottom: 10px;

      color: #334155;

    }


    audio {

      width: 100%;

      height: 42px;

    }


    /* =========================================
       BOTTOM ACTIONS
       ========================================= */

    .actions {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      padding: 20px 22px 22px;

      border-top: 1px solid var(--border);

      background: #fcfdff;

    }


    .action-button {

      border: none;

      border-radius: 13px;

      padding: 14px 12px;

      font-size: 13px;

      font-weight: 800;

      cursor: pointer;

      transition: all 0.2s ease;

    }


    .action-button:active {

      transform: scale(0.98);

    }


    .save-button {

      background:
        linear-gradient(
          135deg,
          #16a34a,
          #15803d
        );

      color: white;

      box-shadow:
        0 8px 18px
        rgba(22, 163, 74, 0.18);

    }


    .history-button {

      background: #edf2f7;

      color: #334155;

    }


    /* =========================================
       DISABLED
       ========================================= */

    button:disabled {

      opacity: 0.42;

      cursor: not-allowed;

      transform: none !important;

      box-shadow: none !important;

    }


    /* =========================================
       FOOTER STATUS
       ========================================= */

    .footer-status {

      text-align: center;

      min-height: 24px;

      padding: 0 20px 22px;

      font-size: 12px;

      color: var(--muted);

      line-height: 1.5;

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 520px) {

      body {

        padding:
          12px 10px
          calc(14px + env(safe-area-inset-bottom));

      }


      .topbar {

        margin-bottom: 12px;

      }


      .brand-icon {

        width: 42px;

        height: 42px;

        border-radius: 13px;

      }


      .brand-title {

        font-size: 15px;

      }


      .speaker-badge {

        max-width: 145px;

        font-size: 10px;

        padding: 8px 10px;

      }


      .doubt-header {

        padding: 22px 18px;

      }


      .doubt-title {

        font-size: 20px;

      }


      .context,

      .form-section,

      .recorder-area {

        padding-left: 18px;

        padding-right: 18px;

      }


      .actions {

        padding-left: 18px;

        padding-right: 18px;

      }


      .timer {

        font-size: 48px;

      }


      .record-button-ring {

        width: 108px;

        height: 108px;

      }


      .record-button {

        width: 78px;

        height: 78px;

      }

    }


    /* =========================================
       VERY SMALL PHONES
       ========================================= */

    @media (max-width: 360px) {

      .speaker-badge {

        max-width: 120px;

      }


      .speaker-badge span {

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;

      }


      .actions {

        grid-template-columns: 1fr;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ======================================
       TOP BAR
       ====================================== -->

  <div class="topbar">


    <div class="brand">

      <div class="brand-icon">
        🎙️
      </div>


      <div>

        <div class="brand-title">
          CA Doubt Recorder
        </div>

        <div class="brand-subtitle">
          Capture your doubts. Keep learning.
        </div>

      </div>

    </div>


    <div class="speaker-badge">

      <span class="speaker-dot"></span>

      <span id="speaker">
      </span>

    </div>


  </div>



  <!-- ======================================
       MAIN CARD
       ====================================== -->

  <div class="main-card">


    <!-- DOUBT HEADER -->

    <div class="doubt-header">

      <div class="small-label">
        Current Doubt
      </div>


      <h1
        class="doubt-title"
        id="subject"
      >
        —
      </h1>


      <div
        class="doubt-section"
        id="section"
      >
        —
      </div>

    </div>



    <!-- DOUBT TEXT -->

    <div class="context">

      <div class="context-label">
        Your Question
      </div>


      <div
        class="doubt-text"
        id="doubt"
      >
        —
      </div>

    </div>



    <!-- RECORDING NAME -->

    <div class="form-section">

      <label
        class="input-label"
        for="recordingName"
      >
        Recording Name
      </label>


      <input

        id="recordingName"

        class="recording-input"

        type="text"

        placeholder="Give this recording a name"

        autocomplete="off"

      >

    </div>



    <!-- RECORDER -->

    <div
      class="recorder-area"
      id="recorderArea"
    >


      <div
        class="status-pill"
        id="statusPill"
      >

        <span
          class="status-dot"
          id="statusDot"
        ></span>

        <span id="statusText">
          Ready to record
        </span>

      </div>



      <div
        class="timer"
        id="timer"
      >
        00:00
      </div>



      <div
        class="record-button-wrap"
        id="recordButtonWrap"
      >

        <div class="record-button-ring">

          <button

            id="startBtn"

            class="record-button"

            onclick="startRecording()"

            title="Start Recording"

          >
            🎙️
          </button>

        </div>

      </div>


      <div
        class="record-label"
        id="recordLabel"
      >
        Tap to start recording
      </div>



      <div class="controls">


        <button

          id="stopBtn"

          class="control-button stop"

          onclick="stopRecording()"

          disabled

        >
          ⏹ Stop
        </button>


        <button

          id="resetBtn"

          class="control-button"

          onclick="resetRecorder()"

          disabled

        >
          🔄 Reset
        </button>


      </div>



      <!-- AUDIO PLAYER -->

      <div
        class="audio-section"
        id="audioSection"
      >

        <div class="audio-title">

          <span>🎧</span>

          <span>
            Listen before saving
          </span>

        </div>


        <audio

          id="audioPlayer"

          controls

        ></audio>

      </div>


    </div>



    <!-- ACTION BUTTONS -->

    <div class="actions">


      <button

        id="saveBtn"

        class="action-button save-button"

        onclick="saveRecording()"

        disabled

      >
        ☁️ Save to Google Drive
      </button>


      <button

        id="historyBtn"

        class="action-button history-button"

        onclick="openHistory()"

      >
        📜 Voice History
      </button>


    </div>



    <!-- STATUS -->

    <div
      class="footer-status"
      id="status"
    >
      Ready to record.
    </div>


  </div>


</div>



<!-- Hidden upload frame -->

<iframe

  name="uploadFrame"

  id="uploadFrame"

  style="display:none;"

></iframe>



<script>


/* =====================================================
   APPS SCRIPT URL
   ===================================================== */

const APPS_SCRIPT_URL =

  'https://script.google.com/macros/s/AKfycbybRayDZ42dKvOauNAzVCYcP2YSNhQgUesV2KD4ianQSz1daTLz8s_zfL3Pu9cxmzX2yQ/exec';



/* =====================================================
   OPEN HISTORY
   ===================================================== */

function openHistory() {


  if (!APPS_SCRIPT_URL) {

    alert(
      'Apps Script URL is missing.'
    );

    return;

  }


  const historyURL =

    APPS_SCRIPT_URL +

    '?action=history&speaker=' +

    encodeURIComponent(
      speaker
    );


  window.open(
    historyURL,
    '_blank'
  );

}



/* =====================================================
   READ GOOGLE SHEET INFORMATION
   ===================================================== */

const params =

  new URLSearchParams(
    window.location.search
  );


const row =

  params.get('row') || '';


const speaker =

  params.get('speaker') ||

  'Dhabbaaa swaram';


const subject =

  params.get('subject') || '';


const section =

  params.get('section') || '';


const doubt =

  params.get('doubt') || '';



/* =====================================================
   SHOW INFORMATION
   ===================================================== */

document.getElementById(
  'speaker'
).innerText = speaker;


document.getElementById(
  'subject'
).innerText =

  subject || 'CA Doubt';


document.getElementById(
  'section'
).innerText =

  section || 'No section specified';


document.getElementById(
  'doubt'
).innerText =

  doubt || 'No doubt text provided';



/* =====================================================
   DEFAULT RECORDING NAME
   ===================================================== */

document.getElementById(
  'recordingName'
).value =

  (

    subject ||

    'CA Doubt'

  )

  +

  (

    section

      ? ' - ' + section

      : ''

  );



/* =====================================================
   RECORDING VARIABLES
   ===================================================== */

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let timerInterval = null;

let seconds = 0;



/* =====================================================
   ELEMENTS
   ===================================================== */

const recorderArea =

  document.getElementById(
    'recorderArea'
  );


const statusPill =

  document.getElementById(
    'statusPill'
  );


const statusText =

  document.getElementById(
    'statusText'
  );


const statusDot =

  document.getElementById(
    'statusDot'
  );


const recordLabel =

  document.getElementById(
    'recordLabel'
  );


const audioSection =

  document.getElementById(
    'audioSection'
  );


const audioPlayer =

  document.getElementById(
    'audioPlayer'
  );



/* =====================================================
   STATUS UI
   ===================================================== */

function setStatus(
  message,
  type = 'ready'
) {


  statusText.innerText =
    message;


  statusPill.classList.remove(
    'recording',
    'success'
  );


  if (
    type === 'recording'
  ) {

    statusPill.classList.add(
      'recording'
    );

  }


  if (
    type === 'success'
  ) {

    statusPill.classList.add(
      'success'
    );

  }


  document.getElementById(
    'status'
  ).innerText =
    message;

}



/* =====================================================
   START RECORDING
   ===================================================== */

async function startRecording() {


  try {


    const stream =

      await navigator
        .mediaDevices
        .getUserMedia({

          audio: true

        });


    audioChunks = [];


    mediaRecorder =

      new MediaRecorder(
        stream
      );


    mediaRecorder.ondataavailable =

      function(event) {


        if (
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =

      function() {


        audioBlob =

          new Blob(

            audioChunks,

            {

              type:
                'audio/webm'

            }

          );


        const audioURL =

          URL.createObjectURL(
            audioBlob
          );


        audioPlayer.src =
          audioURL;


        audioSection.style.display =
          'block';


        document.getElementById(
          'saveBtn'
        ).disabled = false;


        setStatus(
          'Recording finished. Listen before saving.',
          'success'
        );


        recordLabel.innerText =
          'Recording ready to save';

      };


    mediaRecorder.start();


    document.getElementById(
      'startBtn'
    ).disabled = true;


    document.getElementById(
      'stopBtn'
    ).disabled = false;


    document.getElementById(
      'resetBtn'
    ).disabled = true;


    recorderArea.classList.add(
      'recording-active'
    );


    recordLabel.innerText =
      'Recording in progress...';


    seconds = 0;


    document.getElementById(
      'timer'
    ).innerText =
      '00:00';


    timerInterval =

      setInterval(

        updateTimer,

        1000

      );


    setStatus(
      'Recording...',
      'recording'
    );

  }


  catch(error) {


    console.error(error);


    setStatus(
      'Microphone permission failed.',
      'ready'
    );


    alert(
      'Please allow microphone access and try again.'
    );

  }

}



/* =====================================================
   STOP RECORDING
   ===================================================== */

function stopRecording() {


  if (

    mediaRecorder &&

    mediaRecorder.state !==
      'inactive'

  ) {


    mediaRecorder.stop();


    mediaRecorder.stream
      .getTracks()
      .forEach(

        track =>
          track.stop()

      );

  }


  clearInterval(
    timerInterval
  );


  document.getElementById(
    'startBtn'
  ).disabled = true;


  document.getElementById(
    'stopBtn'
  ).disabled = true;


  document.getElementById(
    'resetBtn'
  ).disabled = false;


  recorderArea.classList.remove(
    'recording-active'
  );

}



/* =====================================================
   TIMER
   ===================================================== */

function updateTimer() {


  seconds++;


  const minutes =

    Math.floor(
      seconds / 60
    );


  const secs =

    seconds % 60;


  document.getElementById(
    'timer'
  ).innerText =

    String(minutes)
      .padStart(2, '0')

    +

    ':'

    +

    String(secs)
      .padStart(2, '0');

}



/* =====================================================
   RESET
   ===================================================== */

function resetRecorder() {


  audioChunks = [];

  audioBlob = null;


  audioPlayer.pause();

  audioPlayer.src = '';


  audioSection.style.display =
    'none';


  document.getElementById(
    'timer'
  ).innerText =
    '00:00';


  document.getElementById(
    'startBtn'
  ).disabled = false;


  document.getElementById(
    'stopBtn'
  ).disabled = true;


  document.getElementById(
    'resetBtn'
  ).disabled = true;


  document.getElementById(
    'saveBtn'
  ).disabled = true;


  recorderArea.classList.remove(
    'recording-active'
  );


  recordLabel.innerText =
    'Tap to start recording';


  setStatus(
    'Ready to record.',
    'ready'
  );


  seconds = 0;

}



/* =====================================================
   SAVE RECORDING
   ===================================================== */

function saveRecording() {


  if (!audioBlob) {

    return;

  }


  const recordingName =

    document
      .getElementById(
        'recordingName'
      )
      .value
      .trim();


  if (!recordingName) {


    alert(
      'Please enter a recording name.'
    );


    return;

  }


  document.getElementById(
    'saveBtn'
  ).disabled = true;


  setStatus(
    'Saving to Google Drive...',
    'ready'
  );


  const reader =

    new FileReader();


  reader.onloadend =

    function() {


      const base64 =

        reader.result
          .split(',')[1];


      const form =

        document.createElement(
          'form'
        );


      form.method =
        'POST';


      form.action =
        APPS_SCRIPT_URL;


      form.target =
        'uploadFrame';



      /* AUDIO */

      addField(
        form,
        'audioData',
        base64
      );



      /* RECORDING NAME */

      addField(
        form,
        'recordingName',
        recordingName
      );



      /* FILE NAME */

      addField(
        form,
        'fileName',
        recordingName + '.webm'
      );



      /* ROW */

      addField(
        form,
        'rowNumber',
        row
      );



      /* SPEAKER */

      addField(
        form,
        'speaker',
        speaker
      );



      /* SUBJECT */

      addField(
        form,
        'subject',
        subject
      );



      /* SECTION */

      addField(
        form,
        'section',
        section
      );



      /* DOUBT */

      addField(
        form,
        'doubt',
        doubt
      );


      document.body.appendChild(
        form
      );


      const iframe =

        document.getElementById(
          'uploadFrame'
        );


      iframe.onload =

        function() {


          setStatus(
            '✅ Saved successfully to Google Drive.',
            'success'
          );


          document.getElementById(
            'saveBtn'
          ).disabled = false;


        };


      form.submit();


      form.remove();

    };


  reader.readAsDataURL(
    audioBlob
  );

}



/* =====================================================
   ADD HIDDEN FIELD
   ===================================================== */

function addField(
  form,
  name,
  value
) {


  const input =

    document.createElement(
      'input'
    );


  input.type =
    'hidden';


  input.name =
    name;


  input.value =
    value;


  form.appendChild(
    input
  );

}

</script>
